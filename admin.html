<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · Heirloom Activities</title>
<meta name="robots" content="noindex">
<link rel="icon" href="images/logo-badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261111g">
<style>
  .intro { background: var(--forest); color: #fff; padding-block: 36px 0; }
  .intro .kicker { color: var(--sage); }
  .intro h1 { font-size: clamp(32px, 5vw, 46px); margin: 8px 0 8px; }
  .intro p { margin: 0 0 22px; max-width: 40em; color: #e1e8dc; font-size: 16.5px; }
  .intro .who { color: #e1e8dc; font-size: 14.5px; }
  .intro .who b { color: #fff; }

  /* Tabs sit on the bottom edge of the green band */
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 0 4px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; appearance: none; border: 0; cursor: pointer; font: inherit; font-family: var(--f-label); font-weight: 700; font-size: 14px;
    padding: 13px 18px 12px; border-radius: 12px 12px 0 0; background: rgba(255,255,255,.1); color: #e1e8dc; display: inline-flex; align-items: center; gap: 8px; }
  .tab:hover { background: rgba(255,255,255,.18); color: #fff; }
  .tab[aria-selected="true"] { background: var(--cream); color: var(--forest-deep); }
  .tab:focus-visible { outline: 3px solid var(--wheat); outline-offset: -3px; }
  .tab .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--wheat); }
  .tab .dot.res { background: #9fb6a4; }

  .page { padding-top: 24px; padding-bottom: 56px; }
  .panel-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .panel-h h2 { font-size: 26px; color: var(--forest); }
  .panel-h p { margin: 4px 0 0; color: var(--ink-soft); font-size: 15px; max-width: 46em; }
  .cal-flag { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-label); font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--barn); }
  .cal-flag.res { color: #4b6b55; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
  .toolbar input[type="search"] { flex: 1 1 220px; min-height: 44px; padding: 9px 14px; border: 1.5px solid var(--line); border-radius: 999px; background: #fff; font-size: 15.5px; }
  .toolbar input[type="search"]:focus { outline: none; border-color: var(--forest); box-shadow: 0 0 0 3px rgba(46,74,54,.15); }
  .seg { display: inline-flex; background: var(--paper); border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; }
  .seg button { appearance: none; border: 0; background: none; font: inherit; font-weight: 600; font-size: 14px; color: var(--ink-soft); padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--forest); color: #fff; }
  .seg .n { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: #f3e5c4; color: #6b4a12; font-size: 12px; }

  .alist { display: grid; gap: 10px; }
  .arow { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; align-items: start; }
  .arow.dim { opacity: .62; }
  .arow .thumb { width: 96px; height: 72px; border-radius: 10px; object-fit: cover; background: var(--sage-soft); display: grid; place-items: center; color: var(--forest); }
  .arow .thumb svg { width: 30px; height: 30px; opacity: .6; }
  .arow h3 { font-size: 19px; margin: 1px 0 3px; text-wrap: balance; }
  .arow .when { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 8px; }
  .chips2 { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .status { font-family: var(--f-label); font-weight: 700; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; padding: 5px 9px; border-radius: 999px; background: var(--sage-soft); color: var(--forest-deep); }
  .status.pending { background: #f3e5c4; color: #6b4a12; }
  .status.off { background: #ebe5d8; color: var(--ink-soft); }
  .status.src { background: #fff; border: 1px solid var(--line); color: var(--ink-soft); }
  .status.partner { background: color-mix(in srgb, #6a5a8e 14%, #fff); color: #4a3d6a; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  .acts .btn { min-height: 38px; }
  .btn-quiet { background: none; border: 0; color: var(--barn); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; padding: 8px 6px; cursor: pointer; font: inherit; font-size: 14px; }
  @media (max-width: 560px) {
    .arow { grid-template-columns: 64px minmax(0, 1fr); gap: 12px; }
    .arow .thumb { width: 64px; height: 64px; }
    .arow h3 { font-size: 17.5px; }
  }
  .empty { background: var(--paper); border-radius: var(--radius); padding: 36px 24px; text-align: center; color: var(--ink-soft); box-shadow: var(--shadow); }
  .empty h2 { font-size: 22px; color: var(--forest); margin-bottom: 6px; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
  .msg { margin: 0 0 14px; border-radius: 10px; padding: 11px 13px; font-size: 14.5px; font-weight: 600; }
  .msg.err { background: #f7e1dd; color: var(--barn-dark); }
  .msg.ok { background: var(--sage-soft); color: var(--forest-deep); }

  /* Photo library */
  .add-photo { background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 16px; margin-bottom: 22px; }
  .add-photo .pick { width: 180px; aspect-ratio: 4 / 3; border-radius: 12px; border: 2px dashed var(--line); background: #fff center / cover no-repeat; display: grid; place-items: center; text-align: center; color: var(--forest); font-weight: 700; font-size: 14px; cursor: pointer; padding: 10px; }
  .add-photo .pick.has { border-style: solid; color: transparent; }
  .add-photo h3 { font-size: 19px; margin: 0 0 8px; }
  .f2 { display: grid; gap: 10px; }
  .f2 label.lbl2 { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .f2 input[type="text"], .f2 textarea { width: 100%; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; font: inherit; font-size: 15px; }
  .f2 textarea { min-height: 64px; resize: vertical; }
  .f2 input:focus, .f2 textarea:focus { outline: none; border-color: var(--forest); box-shadow: 0 0 0 3px rgba(46,74,54,.15); }
  .checks { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
  .checks label { display: inline-flex; gap: 7px; align-items: center; cursor: pointer; }
  .checks input { width: 17px; height: 17px; accent-color: var(--forest); }
  @media (max-width: 560px) { .add-photo { grid-template-columns: 1fr; } .add-photo .pick { width: 100%; } }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
  .photo { background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
  .photo .img { position: relative; aspect-ratio: 16 / 10; background: var(--sage-soft); }
  .photo .img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo .rank { position: absolute; left: 10px; top: 10px; background: rgba(28,48,36,.82); color: #fff; font-family: var(--f-label); font-weight: 700; font-size: 12px; padding: 4px 9px; border-radius: 999px; }
  .photo .used { position: absolute; right: 10px; top: 10px; background: rgba(251,248,241,.92); color: var(--forest-deep); font-size: 12px; font-weight: 600; padding: 4px 9px; border-radius: 999px; }
  .photo .body { padding: 12px; display: grid; gap: 9px; flex: 1; }
  .photo .row2 { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: auto; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; cursor: pointer; display: grid; place-items: center; color: var(--forest); font-size: 16px; }
  .icon-btn:disabled { opacity: .35; cursor: default; }
  .icon-btn:not(:disabled):hover { border-color: var(--forest); }

  /* People */
  .people { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .plist { background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .plist h3 { font-size: 20px; color: var(--forest); }
  .plist p { margin: 0; font-size: 14px; color: var(--ink-soft); }
  .plist ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 360px; overflow: auto; }
  .plist li { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px 6px 6px 12px; font-size: 14.5px; word-break: break-all; }
  .plist li.me { border-color: var(--wheat); }
  .plist li .x { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; }
  .plist li .x:hover { background: #f7e1dd; color: var(--barn); }
  .plist form { display: flex; gap: 6px; margin-top: auto; }
  .plist form input { flex: 1; min-width: 0; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 999px; font: inherit; font-size: 14.5px; background: #fff; }
  .savebar { margin-top: 18px; background: var(--cream); padding: 12px 0; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); }
  .savebar p { margin: 0; color: var(--ink-soft); font-size: 14px; }

  /* Volunteers */
  .tab-n { min-width: 20px; padding: 1px 7px; border-radius: 999px; background: var(--wheat); color: var(--forest-deep); font-size: 12px; text-align: center; }
  .toolbar select { min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 999px; background: #fff; font: inherit; font-size: 14.5px; }
  .toolbar .tog { display: inline-flex; align-items: center; gap: 7px; font-size: 14.5px; cursor: pointer; }
  .toolbar .tog input { width: 18px; height: 18px; accent-color: var(--forest); }
  .vlist { display: grid; gap: 10px; }
  .vol { background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 18px; }
  .vol h3 { font-size: 20px; margin: 0 0 2px; }
  .vol .sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 8px; word-break: break-word; }
  .vol .sub a { color: var(--forest); font-weight: 600; }
  .vol .cm { margin: 8px 0 0; font-size: 14.5px; white-space: pre-wrap; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
  .vol .side { display: grid; gap: 8px; align-content: start; }
  .vol .side select, .vol .side textarea { width: 100%; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; font: inherit; font-size: 14.5px; }
  .vol .side textarea { min-height: 64px; resize: vertical; }
  .vol .side .lbl { font-size: 13px; }
  .vol .side .row3 { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .vol .saved { font-size: 13px; color: var(--forest); }
  .status.new { background: #f3e5c4; color: #6b4a12; }
  .status.news { background: #e6eadc; }
  @media (max-width: 680px) { .vol { grid-template-columns: 1fr; gap: 12px; } }


  /* People list + profiles */
  .plist2 { display: grid; gap: 8px; }
  .prow { appearance: none; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; width: 100%; background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 12px 14px; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  .prow:hover { box-shadow: 0 0 0 2px var(--sage), var(--shadow); }
  .prow:focus-visible { outline: 3px solid var(--forest); outline-offset: 2px; }
  .prow .pmain { display: grid; gap: 2px; min-width: 0; }
  .prow .pmain b { font-family: var(--f-display); font-size: 18px; font-weight: 600; }
  .prow .sub { color: var(--ink-soft); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prow .chips2 { margin: 4px 0 0; }
  .prow .pstat { display: grid; text-align: right; font-size: 13px; color: var(--ink-soft); }
  .prow .pstat b { font-size: 15px; color: var(--forest); }
  .av { width: 44px; height: 44px; border-radius: 50%; background: var(--sage-soft); color: var(--forest-deep); display: grid; place-items: center; font-family: var(--f-label); font-weight: 700; font-size: 15px; }
  .av.res { background: var(--forest); color: #fff; }
  .av.big { width: 64px; height: 64px; font-size: 21px; }
  @media (max-width: 560px) { .prow { grid-template-columns: 40px minmax(0, 1fr); } .prow .av { width: 40px; height: 40px; } .prow .pstat { grid-column: 2; text-align: left; display: flex; gap: 8px; } }
  .btn-back { appearance: none; border: 0; background: none; font: inherit; font-weight: 700; color: var(--forest); cursor: pointer; padding: 6px 0; font-size: 15px; }
  .phead { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 14px; }
  .phead h2 { font-size: 28px; color: var(--forest); }
  .phead .sub { margin: 2px 0 0; color: var(--ink-soft); font-size: 14.5px; word-break: break-word; }
  .phead .sub a { color: var(--forest); font-weight: 600; }
  .phead .impact { display: grid; text-align: right; font-size: 13.5px; color: var(--ink-soft); }
  .phead .impact b { font-family: var(--f-display); font-size: 26px; color: var(--forest); font-weight: 600; }
  @media (max-width: 640px) { .phead { grid-template-columns: auto minmax(0, 1fr); } .phead .impact { grid-column: 1 / -1; text-align: left; } }
  .pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
  .pgrid .wide { grid-column: 1 / -1; }
  @media (max-width: 760px) { .pgrid { grid-template-columns: 1fr; } }
  .pcard { background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; display: grid; gap: 10px; align-content: start; margin-bottom: 14px; }
  .pgrid .pcard { margin-bottom: 0; }
  .pcard h3 { font-size: 19px; color: var(--forest); margin: 0; }
  .pcard .lbl { font-size: 13.5px; }
  .pcard input[type="text"], .pcard input[type="tel"], .pcard input[type="email"], .pcard select, .pcard textarea, .addslot select {
    display: block; width: 100%; margin-top: 3px; min-height: 42px; padding: 8px 11px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; font: inherit; font-size: 15px; font-weight: 400; }
  .pcard input:disabled { background: var(--cream); color: var(--ink-soft); }
  .pcard textarea { min-height: 84px; resize: vertical; }
  .pcard p { margin: 0; }
  .pcard p .lbl { margin-bottom: 2px; }
  .pcard .cm { display: block; white-space: pre-wrap; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 14.5px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .chk { display: flex; gap: 9px; align-items: flex-start; font-size: 15px; cursor: pointer; }
  .chk input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--forest); flex: none; }
  .privacy { margin: 0; font-size: 13px; }
  .vbox, .vfields { display: grid; gap: 10px; }
  .vbox[hidden], .vfields[hidden] { display: none; }
  .switch { display: flex; gap: 12px; align-items: center; cursor: pointer; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .switch .track { flex: none; width: 46px; height: 26px; border-radius: 999px; background: #cfd3c8; position: relative; transition: background .15s; }
  .switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
  .switch input:checked + .track { background: var(--forest); }
  .switch input:checked + .track::after { transform: translateX(20px); }
  .switch input:focus-visible + .track { outline: 3px solid var(--wheat); outline-offset: 2px; }
  .switch .hint { font-size: 13px; }
  .pgrid .savebar { margin-top: 0; position: sticky; bottom: 0; z-index: 2; }
  .clist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .clist li { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 12px; }
  .clist li > span { display: grid; }
  .clist .hint { font-size: 13px; }
  .addslot { display: flex; gap: 8px; align-items: center; }
  .addslot select { margin: 0; flex: 1; min-width: 0; }
  .removed-bar { display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: #f3e5c4; color: #5a3d0c; border-radius: var(--radius); padding: 12px 16px; margin-bottom: 14px; }
  .removed-bar p { margin: 0; font-size: 14.5px; max-width: 52em; }
  .pcard.danger { border: 1.5px solid #e7c9c2; }
  .pcard.danger h3 { color: var(--barn); }
  .act ul { margin: 4px 0 0; padding-left: 18px; font-size: 14.5px; display: grid; gap: 3px; }
  .act li.past { color: var(--muted); }
  .act + .act { margin-top: 4px; }
  #addP .two input, #addP > .lbl input { display: block; width: 100%; margin-top: 3px; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 10px; font: inherit; background: #fff; }

  .trn { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13.5px; }
  .trn label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .trn input { width: 16px; height: 16px; accent-color: var(--forest); }

  /* Chore chart */
  .cday { margin-bottom: 18px; }
  .cday h3 { font-family: var(--f-label); font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--barn); margin: 0 0 8px; }
  .slotf { background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; margin-bottom: 8px; display: grid; gap: 8px;
    grid-template-columns: minmax(150px, 2fr) 120px 130px 86px minmax(120px, 1.1fr) minmax(170px, 1.5fr); align-items: end; }
  .slotf.add-slot { grid-template-columns: minmax(150px, 2fr) 130px 86px minmax(120px, 1.1fr) minmax(170px, 1.5fr); }
  .slotf .opt { font-weight: 400; }
  .slotf .days { grid-column: 1 / -1; border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 14px; }
  .slotf .days legend { font-size: 12.5px; font-weight: 600; color: var(--ink-soft); padding: 0; margin-bottom: 4px; }
  .slotf .days label { display: inline-flex; gap: 5px; align-items: center; font-size: 14px; color: var(--ink); }
  .slotf .days input, .slotf .alld input { width: 17px; height: 17px; min-height: 0; accent-color: var(--forest); }
  .slotf .alld { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; font-weight: 400; font-size: 13.5px; }
  .slotf.open { border: 2px dashed var(--wheat); }
  .slotf label { display: grid; gap: 3px; font-size: 12.5px; font-weight: 600; color: var(--ink-soft); }
  .slotf input, .slotf select { width: 100%; min-height: 38px; padding: 6px 9px; border: 1.5px solid var(--line); border-radius: 9px; background: #fff; font: inherit; font-size: 14px; }
  .slotf .notes { grid-column: 1 / 4; }
  .slotf .sbtns { grid-column: 4 / -1; }
  .slotf .sbtns { display: flex; gap: 6px; align-items: center; justify-content: flex-end; }
  @media (max-width: 980px) { .slotf, .slotf.add-slot { grid-template-columns: 1fr 1fr; } .slotf .notes, .slotf .sbtns { grid-column: 1 / -1; } }
  .add-slot { border: 2px solid var(--forest); }
  .slotd { background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 6px; }
  .slotd.open-slot { outline: 2px dashed var(--wheat); }
  .slotd > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) 110px 52px minmax(110px, 180px) auto auto; gap: 10px; align-items: center; padding: 10px 14px; font-size: 14.5px; }
  .slotd > summary::-webkit-details-marker { display: none; }
  .slotd > summary .w, .slotd > summary .h { color: var(--ink-soft); }
  .slotd > summary .who { font-weight: 600; color: var(--forest-deep); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slotd > summary .who.pool { color: var(--ink-soft); font-weight: 500; }
  .slotd > summary .who.open { color: #8a5a10; }
  .slotd > summary .ed { color: var(--forest); font-weight: 700; font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; }
  .slotd[open] > summary .ed { visibility: hidden; }
  .slotd[open] > summary { border-bottom: 1px solid var(--line); }
  .slotd .slotf { box-shadow: none; margin: 0; background: none; }
  .slotd .slotf.open { border: 0; }
