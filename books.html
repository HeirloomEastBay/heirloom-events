<style>
  .page { padding-top: 24px; padding-bottom: 48px; display: grid; gap: 30px; max-width: 900px; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
  .sec h2 { font-size: clamp(24px, 4vw, 30px); color: var(--forest); margin: 0 0 14px; }
  .books { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 14px; }
  .book { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 16px; align-items: start; background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .book img, .book .nocover { width: 110px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.18); background: var(--tint-sage); }
  .book .nocover { display: grid; place-items: center; font-size: 36px; }
  .bi { display: grid; gap: 4px; } .bi h3 { margin: 0; font-size: 20px; color: var(--forest-deep); }
  .bfor { font-family: var(--f-label); font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--barn); }
  .bi p { margin: 0; color: var(--ink-soft); font-size: 15px; } .bi .bact { margin-top: 8px; }
  .past .book { grid-template-columns: 72px minmax(0, 1fr); padding: 12px; } .past .book img, .past .book .nocover { width: 72px; } .past .bi h3 { font-size: 17px; }
  .empty-s { color: var(--muted); margin: 0; }
  .intro { background: var(--forest-fill); color: #fff; padding-block: 34px 30px; }
  .intro .kicker { color: var(--sage); font-family: var(--f-label); font-weight: 700; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  .intro h1 { font-size: clamp(32px, 6vw, 48px); margin: 6px 0 8px; } .intro p { margin: 0; max-width: 640px; color: #e2e8df; }
</style>
</head>

    <h1>Books we read together</h1>
    <p>Each week we read a Psalm or Proverb and a Bible story with the kids. These are the books we read from, and the ones we've read before.</p>
  </div></section>
  <main class="wrap page" id="app" aria-live="polite"><p class="loading">Loading…</p></main>
