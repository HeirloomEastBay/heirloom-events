<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My events · Heirloom Activities</title>
<meta name="description" content="See, edit and cancel the events you've shared on the Heirloom calendar.">
<meta name="robots" content="noindex">
<link rel="icon" href="images/logo-badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261110c">
<style>
  .intro { background: var(--forest); color: #fff; padding-block: 40px 36px; }
  .intro .kicker { color: var(--sage); }
  .intro h1 { font-size: clamp(34px, 5vw, 50px); margin: 8px 0 10px; }
  .intro p { margin: 0; max-width: 34em; color: #e1e8dc; font-size: 17px; }
  .page { max-width: 820px; margin: 0 auto; padding-top: 28px; }

  /* Sign in */
  .signin { max-width: 460px; margin: 0 auto; background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 24px; display: grid; gap: 14px; }
  .signin h2 { font-size: 26px; }
  .signin p { margin: 0; color: var(--ink-soft); }
  .signin label { font-weight: 600; font-size: 15px; }
  .signin input { width: 100%; min-height: 50px; padding: 11px 14px; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; font-size: 17px; }
  .signin input:focus { outline: none; border-color: var(--forest); box-shadow: 0 0 0 3px rgba(46,74,54,.15); }
  .signin input.code { font-family: var(--f-title); font-size: 30px; letter-spacing: .3em; text-align: center; }
  .signin .btn { width: 100%; min-height: 52px; font-size: 16px; }
  .signin .small { font-size: 14px; color: var(--muted); }
  .link-btn { background: none; border: 0; padding: 0; color: var(--forest); font-weight: 600; text-decoration: underline; cursor: pointer; font: inherit; font-size: 14px; }
  .msg { margin: 0; border-radius: 10px; padding: 11px 13px; font-size: 14.5px; font-weight: 600; }
  .msg.err { background: #f7e1dd; color: var(--barn-dark); }
  .msg.ok { background: var(--sage-soft); color: var(--forest-deep); }

  /* List */
  .who { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .who p { margin: 0; color: var(--ink-soft); }
  .who b { color: var(--ink); }
  .who .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .group-h { display: flex; align-items: center; gap: 12px; margin: 28px 0 12px; }
  .group-h:first-of-type { margin-top: 0; }
  .group-h h2 { font-size: 22px; color: var(--forest); white-space: nowrap; }
  .group-h::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .mine-list { display: grid; gap: 12px; }
  .mine { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 16px; background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; align-items: start; }
  .mine.dim { opacity: .7; }
  .mine img { width: 112px; height: 84px; object-fit: cover; border-radius: 10px; background: var(--sage-soft); }
  .mine h3 { font-size: 20px; margin: 2px 0 4px; text-wrap: balance; }
  .mine .when { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 8px; }
  .mine .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 10px; }
  .status { font-family: var(--f-label); font-weight: 700; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: var(--sage-soft); color: var(--forest-deep); }
  .status.pending { background: #f3e5c4; color: #6b4a12; }
  .status.off { background: #ebe5d8; color: var(--ink-soft); }
  .mine .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  @media (max-width: 520px) {
    .mine { grid-template-columns: 76px minmax(0, 1fr); gap: 12px; }
    .mine img { width: 76px; height: 76px; }
    .mine h3 { font-size: 18px; }
  }
  .empty { background: var(--paper); border-radius: var(--radius); padding: 36px 24px; text-align: center; color: var(--ink-soft); box-shadow: var(--shadow); }
  .empty h2 { font-size: 24px; color: var(--forest); margin-bottom: 8px; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
</style>
</head>
<body>
  <div class="demo-banner" id="demoBanner" hidden>Preview mode with sample events. Use any email and the code 123456.</div>

  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="index.html" aria-label="Heirloom Activities">
        <img class="badge" src="images/logo-badge.png" alt="">
        <img class="wordmark" src="images/logo-wordmark.svg" alt="Heirloom East Bay">
      </a>
      <nav class="nav" aria-label="Main">
        <a class="btn btn-outline btn-sm" href="index.html">See the calendar</a>
      </nav>
    </div>
  </header>

  <section class="intro">
    <div class="wrap">
      <span class="kicker">Heirloom Activities</span>
      <h1>My events</h1>
      <p>Everything you've shared on the Heirloom calendar, in one place. Edit details, cancel, or see who's coming.</p>
    </div>
  </section>

  <main class="wrap page" id="app" aria-live="polite"></main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="footer-small" style="border:0;margin:0;padding:0">
        <p><img src="images/logo-wordmark-white.svg" alt="Heirloom East Bay" style="width:170px;margin-bottom:12px"></p>
        <p id="footLine"></p>
      </div>
    </div>
  </footer>

<script src="config.js?v=20261110c"></script>
<script src="common.js?v=20261110c"></script>
<script src="mine.js?v=20261110c"></script>
</body>
</html>
