<style>
  .intro { background: var(--forest-fill); color: #fff; padding-block: 36px 26px; }
  .intro .kicker { color: var(--sage); }
  .intro h1 { font-size: clamp(32px, 5vw, 46px); margin: 8px 0 8px; }
  .intro p { margin: 0; max-width: 44em; color: #e1e8dc; font-size: 16.5px; }
  .page { padding-top: 24px; padding-bottom: 56px; display: grid; gap: 26px; max-width: 820px; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; }
  .card { background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px 22px; }
  .card h2 { font-size: clamp(22px, 4vw, 28px); color: var(--forest); margin: 0 0 8px; }
  .card > p { color: var(--ink-soft); margin: 0 0 12px; line-height: 1.55; }
  .msg { margin: 0; padding: 12px 16px; border-radius: 12px; font-weight: 600; }
  .msg.err { background: var(--tint-red); color: var(--barn-dark); } .msg.ok { background: var(--sage-soft); color: var(--forest-deep); }
  .count { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-radius: 14px; background: var(--sage-soft); color: var(--forest-deep); font-weight: 600; }
  .count b { font-family: var(--f-title); font-size: 30px; line-height: 1; }
  .meter { flex: 1; height: 10px; border-radius: 99px; background: var(--surface); overflow: hidden; min-width: 80px; } .meter i { display: block; height: 100%; background: var(--forest-fill); border-radius: 99px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; background: var(--tint-sage); color: var(--forest-deep); font-family: var(--f-label); font-weight: 700; font-size: 13px; letter-spacing: .03em; border: 1.5px solid var(--sage); }
  .steps { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
  .steps li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; color: var(--ink-soft); }
  .steps li i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-style: normal; font-weight: 700; font-size: 13px; background: var(--surface); }
  .steps li.done i { background: var(--forest-fill); border-color: var(--forest); color: #fff; } .steps li.now i { border-color: var(--wheat); background: var(--tint-wheat); }
  .steps li b { color: var(--ink); display: block; }
  form.f { display: grid; gap: 16px; }
  .f label.q { display: grid; gap: 6px; font-weight: 600; font-size: 15.5px; }
  .f .opt { font-weight: 400; color: var(--muted); } .f .req { color: var(--barn); }
  .f input[type="text"], .f input[type="email"], .f input[type="tel"], .f input[type="date"], .f input[type="number"], .f textarea, .f select { width: 100%; min-height: 48px; padding: 10px 13px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; font: inherit; font-size: 16px; font-weight: 400; }
  .f textarea { min-height: 96px; resize: vertical; }
  .f input:focus, .f textarea:focus, .f select:focus { outline: none; border-color: var(--forest); box-shadow: 0 0 0 3px rgba(46,74,54,.15); }
  .f fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; } .f legend { font-weight: 600; font-size: 15.5px; margin-bottom: 6px; padding: 0; }
  .f .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .f .choices label { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 8px 15px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 600; cursor: pointer; }
  .f .choices input { accent-color: var(--forest); } .f .choices label:has(input:checked) { border-color: var(--forest); background: var(--sage-soft); }
  .f .other { max-width: 360px; }
  .f .chk { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 15.5px; line-height: 1.45; }
  .f .chk input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--forest); flex: none; }
  .f .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } @media (max-width: 520px) { .f .two { grid-template-columns: 1fr; } }
  .f .hp { position: absolute; left: -9999px; }
  .f .note { margin: 0; font-size: 14px; color: var(--muted); }
  .f .warn { margin: 0; padding: 10px 14px; border-radius: 10px; background: var(--tint-red); color: var(--barn-dark); font-weight: 600; font-size: 14.5px; } .f .warn:empty { display: none; }
  .mine { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .mine li { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); }
  .mine li b { font-size: 16px; } .mine li span { color: var(--ink-soft); font-size: 14.5px; }
  .pill { font-family: var(--f-label); font-weight: 700; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .pill.wait { background: var(--tint-wheat); color: var(--wheat-ink); } .pill.ok { background: var(--forest-fill); color: #fff; } .pill.off { background: var(--tint-gray); color: var(--muted); }
  .quiet { appearance: none; background: none; border: 0; padding: 4px 2px; font: inherit; font-size: 14px; font-weight: 600; color: var(--barn-dark); text-decoration: underline; cursor: pointer; }
